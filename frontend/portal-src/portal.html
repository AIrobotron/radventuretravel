snow:{title:'4 · Govern customer impact and operational work',classify:'CSM / TSM / ITOM / ITSM packages · configured workflow',body:'Use the installed customer/telecom package for customer-facing work, service relationships and entitlements; use Service Operations Workspace for authorised operators.',configure:['Map account → location → subscribed service → technical service / CI','Configure case/incident, request and change lifecycle; select one record owner','Use workflow and approvals to invoke the supported orchestration action'],verify:'Confirm external-user entitlements, package/licence versions, CSDM relationships and which internal records can be exposed.',output:'Customer-safe status, incident/case ID, approved change and audit trail'},
portal:{title:'5 · Compose the Alumni customer experience',classify:'Native components first · exact map likely a scoped UI extension',body:'Keep standard case/request journeys and reporting. Present a thin, contextual map and navigation layer using supported components and APIs; deep-link to authorised specialist tools when appropriate.',configure:['Carry customer, site, service, resource, incident and time context','Separate service experience from ticket priority and work status','Show evidence source and freshness; retain persona permissions'],verify:'Prototype the geographic component in the target release. Validate deep links, SSO, accessibility and cross-customer isolation.',output:'Overview → Operations → Engineering with shared context'}
}[s.layer];}
function digitalView(){const p=blueprints[s.domain],info=digitalInfo();screen.innerHTML=`<div class="v3-canvas"><div class="v3-mapbar"><div><strong>AI / Digital · implementation design pattern</strong><p class="ea-small ea-sub">${esc(selected().name)} · Standard packages first, supported integration second</p></div><div class="v3-switch">${[['pattern','Implementation'],['agents','AI experience'],['validate','Validation']].map(([id,n])=>`<button data-act="digitalTab" data-value="${id}" aria-pressed="${s.digitalTab===id}">${n}</button>`).join('')}</div></div>${s.digitalTab==='pattern'?`<div class="v5-digital"><label>Portfolio domain<select id="v5-domain">${Object.entries(blueprints).map(([k,v])=>`<option value="${k}" ${s.domain===k?'selected':''}>${v.name}</option>`).join('')}</select></label><p class="v5-productset">${p.products}</p><div class="v5-bss"><strong>BSS / CRM context</strong><span>Customer · contract · product · entitlement · site</span><span>↓ Stable IDs into the service model</span></div><nav class="v5-platforms" aria-label="Implementation layers">${implementationLayers.map(l=>`<button data-act="layer" data-value="${l.id}" aria-pressed="${s.layer===l.id}"><i data-lucide="${l.icon}" aria-hidden="true"></i><strong>${l.title}</strong><small>${l.tag}</small></button>`).join('')}</nav><div class="v5-dataflows"><span>Telemetry: controllers → Splunk → service evidence</span><span>Context: inventory / paths ↔ ServiceNow service model</span><span>Action: ServiceNow approval → orchestrator / controller → validation</span></div><section class="v5-layer-detail"><span class="ea-note">${info.classify}</span><h2>${info.title}</h2><p>${info.body}</p><ol>${info.configure.map(x=>`<li>${x}</li>`).join('')}</ol><div class="v5-validation-note"><strong>Validate before promising</strong><p>${info.verify}</p></div><p class="ea-small"><strong>Output:</strong> ${info.output}</p></section><p class="ea-note">Controller names are candidate integration points; availability in the customer estate and exact connector coverage are not yet verified.</p></div>`:s.digitalTab==='agents'?agentDesign():validationDesign()}</div>`;}
function agentDesign(){return `<div class="v5-digital"><h2>A service concierge with evidence and bounded actions</h2><p class="v5-productset">Context follows the user: customer → site → service → incident. One conversation, with specialist tools behind it.</p><div class="v5-agent-options">${[['Explain','“Why is this site amber?”','Read permitted KPIs, incidents and changes; distinguish measured facts, hypotheses and missing data.'],['Investigate','“What changed before voice quality dropped?”','Correlate time, service dependencies and recent work; link to source evidence and hand off to the NOC.'],['Prepare','“Add connectivity for a new store.”','Collect intent, select an entitled catalogue item, prepare a request and show price/impact before submission.'],['Act with control','“Restore this service using the approved path.”','Use a tested runbook, explicit approval where required, bounded controller permissions, rollback and independent validation.']].map(([h,q,d])=>`<article><h3>${h}</h3><strong>${q}</strong><p>${d}</p></article>`).join('')}</div><div class="v5-layer-detail"><h3>Package-led starting point</h3><p>ServiceNow Virtual Agent / Now Assist can provide the conversational entry point and approved workflows. Splunk supplies service evidence; Blue Planet or domain tooling supplies supported topology, path and action capabilities. Do not assume each vendor agent is directly customer-facing or mutually interoperable.</p><p class="ea-note">Available product foundations: confirm versions, licences, channels and tools. Exact end-to-end agent behaviour remains to be validated.</p></div><div class="v5-horizon"><strong>Now · Explain and guide</strong><span>Source-linked answers, case summaries, service status and request preparation.</span><strong>Next · Controlled investigation</strong><span>Bounded multi-tool diagnosis, transparent plans and approval-gated recovery.</span><strong>24–36 months · Design direction</strong><span>Proactive impact briefings, intent-based changes, pre-change simulation and supervised multi-domain recovery. Architectural aspiration, not a vendor roadmap commitment.</span></div>${assistantPanel(true)}<p class="ea-note">Every answer should expose evidence, observation time, scope and the next permitted action. Never turn a plausible explanation into a claim of measured recovery.</p></div>`;}
function validationDesign(){return `<div class="v5-digital"><h2>Prove one real service from customer to controller</h2><p class="v5-productset">Start with a retail branch on primary access + LTE; repeat with manufacturing and an enterprise WAN service.</p><div class="v5-proof-grid">${[['01','Identity & entitlement','Demonstrate account, site, subscribed service, technical resources and customer access boundaries.'],['02','Observe & correlate','Inject a lab fault; preserve IDs and timestamps from controller telemetry to Splunk episode and ServiceNow work item.'],['03','Navigate & explain','Show service impact, actual evidence, topology and path through supported UI links/APIs.'],['04','Approve & recover','Run an approved lab action; retain controller job ID, timeout behaviour and rollback.'],['05','Validate & reconcile','Confirm technical and business recovery, then synchronise closure, counts and health without duplicate tickets.'],['06','Package the pattern','Record product versions, licences, endpoints, adapters, mappings, reusable templates and every custom element.']].map(([n,h,d])=>`<article><span>${n}</span><div><h3>${h}</h3><p>${d}</p></div></article>`).join('')}</div><div class="v5-validation-note"><strong>Acceptance rule</strong><p>“Standard” requires a working demonstration on the target release. API existence does not prove a supported connector or low implementation effort.</p></div><div class="v5-layer-detail"><h3>Evidence record for each portal interaction</h3><p>Persona / permission · object IDs · source system · module / version · supported component or API · sample response · refresh / event mechanism · integration classification · proof result · remaining gap.</p><h3>Health rule to agree</h3><p>The demo uses red P1/P2, amber P3/P4 and green with no open incident. Production should separately represent service experience, resilience and stale/unknown data. A healthy backup can preserve customer service while a high-priority circuit incident remains open.</p></div><details class="v5-work"><summary>Vendor reference sources</summary><ul><li><a href="https://www.servicenow.com/products/telecommunications-service-operations.html" target="_blank" rel="noopener">ServiceNow TSOM</a></li><li><a href="https://help.splunk.com/en/splunk-it-service-intelligence/splunk-it-service-intelligence/visualize-and-assess-service-health/4.20/service-analyzer/use-the-service-analyzer-tree-view-in-itsi" target="_blank" rel="noopener">Splunk service dependency navigation</a></li><li><a href="https://www.blueplanet.com/products/route-optimization-and-analysis" target="_blank" rel="noopener">Blue Planet routing intelligence</a></li><li><a href="https://www.servicenow.com/docs/r/telecom-media-technology/now-assist-for-telecom-media-and-technology/using-aiagents-usecases.html" target="_blank" rel="noopener">ServiceNow TMT agentic workflows</a></li></ul></details></div>`;}
function assistantContext(){const siteMode=s.persona==='AI/Digital'||s.view!=='map';return {list:siteMode?[selected()]:scopeSites(),name:siteMode?selected().name:s.hub?cities.find(c=>c.id===s.hub).name:s.country?cities.find(c=>c.country===s.country).countryName:regionNames[s.region],siteMode};}
function assistantPanel(always=false){return `<section class="v5-assistant"><div class="v3-mapbar"><strong>✦ Ask about ${esc(assistantContext().name)}</strong>${always?'':btn(s.assistantOpen?'Close assistant':assistantContext().siteMode?'Ask about this site':'Ask about this area','assistantToggle')}</div>${always||s.assistantOpen?`<div class="v5-assistant-body"><p class="ea-note">Guided interaction demo · prepared responses, not a live AI model</p><div class="v5-suggestions">${['Explain site health','Show open incidents','What should happen next?'].map(q=>btn(q,'ask',q)).join('')}</div><label>Ask a question about this site<input id="v5-question" type="text" placeholder="Why is this site red?" maxlength="400"></label>${btn('Ask','askTyped')}<div class="v5-answer" aria-live="polite">${s.assistantAnswer||'Choose a question to see an answer grounded in the selected site’s demo records.'}</div></div>`:''}</section>`;}
function answerQuestion(q){const context=assistantContext(),list=context.list,c=totalsFor(list),go=context.siteMode?btn('View site incidents','assistantIncidents'):'<p>Select an individual site to inspect its incident records.</p>';if(/incident|ticket|open/i.test(q)){s.assistantAnswer=`<p>${esc(context.name)} has ${c.open.reduce((a,b)=>a+b,0)} open demo incidents: ${c.open.map((n,i)=>'P'+(i+1)+' '+n).join(', ')}.</p><p class="ea-note">Source: selected-site demo incident ledger · current simulation state.</p>${go}`;}else if(/next|repair|fix|resolv|action/i.test(q)){s.assistantAnswer=`<p>Review the highest-priority incident, examine its evidence and proposed recovery, then use the approval-gated NOC workflow. Confirm recovery before closing the work item.</p><p class="ea-note">No live action has been executed.</p>${go}`;}else if(/health|red|amber|green|status|why/i.test(q)){const rag=ragFor(list);s.assistantAnswer=`<p>${esc(context.name)} is ${rag==='bad'?'red because it has an open P1 or P2 incident':rag==='warn'?'amber because it has P3/P4 incidents and no open P1/P2':'green because no demo incidents are open'}.</p><p>There are ${c.request} open service requests and ${c.change} change actions. This ticket-based status does not establish application availability.</p><p class="ea-note">Source: demo ledger and displayed RAG policy; no live telemetry.</p>${go}`;}else s.assistantAnswer='<p>This guided demo can explain site health, list incidents and show the next operational step. A production assistant would retrieve authorised evidence or explicitly identify missing data for this question.</p>';}
const connectedAct=act;
act=function(a,v){if(a==='digitalTab')s.digitalTab=v;else if(a==='domain')s.domain=v;else if(a==='layer')s.layer=v;else if(a==='assistantToggle')s.assistantOpen=!s.assistantOpen;else if(a==='ask'){answerQuestion(v);s.assistantOpen=true;}else if(a==='askTyped'){answerQuestion(root.querySelector('#v5-question')?.value||'');s.assistantOpen=true;}else if(a==='assistantIncidents'){s.persona='Operations';s.view='topology';s.node='incident';s.priority=0;s.ticketState='open';s.assistantOpen=false;}else{if(['site','case','home','region','country','hub','zone','advanceNoc','persona'].includes(a))s.assistantAnswer='';connectedAct(a,v);return;}render();save();};
root.addEventListener('change',e=>{if(e.target.id==='v5-domain')act('domain',e.target.value)});
root.addEventListener('keydown',e=>{if(e.target.id==='v5-question'&&e.key==='Enter'){e.preventDefault();act('askTyped','');}});
// Consistent context and explicit navigation for the geographic and incident journeys.
Object.assign(s,{sitePage:0,highlightIncident:null});
function scopedSiteList(){const list=scopeSites(),size=12,pages=Math.max(1,Math.ceil(list.length/size));s.sitePage=Math.min(s.sitePage||0,pages-1);return `<section class="v6-sites"><div class="v3-mapbar"><strong>Sites in this area · ${list.length}</strong><span class="ea-note">${s.sitePage*size+1}–${Math.min((s.sitePage+1)*size,list.length)} of ${list.length}</span></div><div class="v5-site-list">${list.slice(s.sitePage*size,(s.sitePage+1)*size).map(siteRow).join('')}</div>${pages>1?`<div class="v3-mapbar">${s.sitePage?btn('← Previous sites','sitePage',s.sitePage-1):'<span></span>'}<span class="ea-note">Page ${s.sitePage+1} / ${pages}</span>${s.sitePage<pages-1?btn('Next sites →','sitePage',s.sitePage+1):''}</div>`:''}</section>`;}
const mappedView=mapView;
mapView=function(){mappedView();screen.querySelector('.v5-site-list')?.remove();screen.querySelector('.v3-canvas').insertAdjacentHTML('beforeend',scopedSiteList());};roster=mapView;
const priorSiteRow=siteRow;
siteRow=function(t){return priorSiteRow(t).replace(`${esc(t.kind)} ·`,`${esc(t.city)} · ${esc(t.countryName)} · ${esc(t.kind)} ·`);};
function engineeringMenu(){return `<nav class="v6-engineering" aria-label="Engineering detail"><span>Engineering detail</span>${[['config','Config & business rules'],['verification','Verification'],['history','Change history'],['routing','Routing & path'],['topology','Topology & services'],['qos','Quality of Service (QoS)'],['transactions','Application flows'],['synthetics','Synthetic tests']].map(([id,label])=>`<button data-act="node" data-value="${id}" aria-pressed="${s.node===id}">${label}</button>`).join('')}</nav>`;}
const previousTopology=topologyView;
topologyView=function(){previousTopology();if(s.persona==='Engineering')screen.querySelector('.v3-columns').insertAdjacentHTML('beforebegin',engineeringMenu());if(s.persona==='Operations'&&s.node!=='incident')screen.querySelector('.v3-mapbar').insertAdjacentHTML('beforeend',btn('Open site incidents →','siteIncidents','',true));};
const previousDetail=detail;
detail=function(){if(s.node==='verification')return `<div class="v3-detail"><div><h3>Verification · ${esc(selected().name)}</h3><p>Technical checks and business-service acceptance criteria. These are scenario targets, not live test results.</p></div>${btn('View verification checks','evidence')}</div>`;if(s.node==='config')return `<div class="v3-detail"><div><h3>Configuration & business rules</h3><p>${esc(selected().name)} · Configuration intent, service policy, approval conditions and rollback.</p></div>${btn('Inspect configuration & rules','evidence')}</div>`;return previousDetail();};
const previousEvidence=evidence;
evidence=function(){if(s.node==='verification')return `<div class="v3-evidence"><h3>Service acceptance checks</h3><ul>${(contextEvidence()?curr().verify:['Confirm device and service reachability','Validate approved policy and segmentation','Verify the critical business transaction','Confirm fallback and recovery criteria']).map(x=>`<li>${esc(x)} <span class="ea-note">· Not run</span></li>`).join('')}</ul></div>`;if(s.node==='config')return previousEvidence()+`<div class="v3-evidence"><h3>Business rules · proposed policy</h3><ul><li>Limit actions to the entitled customer, site and service.</li><li>Preserve critical application and voice classes during recovery.</li><li>Require the configured change approval before a service-affecting action.</li><li>Retain rollback criteria and verify business recovery before closure.</li></ul><p class="ea-note">Demonstration policy; validate against the customer’s actual service contract and controller configuration.</p></div>`;if(s.node==='qos')return previousEvidence()+`<div class="v3-evidence"><h3>QoS policy & service classes</h3><p>Inspect classification, queue drops, loss, latency and jitter alongside the forwarding path.</p><div class="v3-facts"><span>Gold · critical transactions / voice</span><span>Silver · business applications</span><span>Bronze · best effort</span></div><p class="ea-note">Illustrative class template, not a discovered configuration. Actual DSCP mappings, shaping rates and guarantees must come from the controller and service policy.</p></div>`;return previousEvidence();};
function liveNocQueue(){const rows=recordsFor([selected()]).filter(r=>!isClosed(r));return `<div class="v3-evidence"><div class="v3-mapbar"><h3>Active site incidents · ${esc(selected().name)}</h3><span class="ea-note">${rows.length} open · current demo state</span></div><div class="v5-ticket-list">${rows.map(r=>`<button data-act="noc" data-value="${r.id}" aria-pressed="${s.record===r.id}"><b>P${r.p}</b><span><strong>${r.id} · ${esc(r.title)}</strong><small>${esc(selected().name)}</small></span><span>${s.record===r.id?'Selected':'Open →'}</span></button>`).join('')||'<p>No active incidents for this site.</p>'}</div></div>`;}
const priorNoc=nocView;
nocView=function(){const r=activeRecord();if(r&&r.siteIds.includes(selected().id)){priorNoc();screen.querySelector('.v5-noc-context').insertAdjacentHTML('afterend',liveNocQueue());}else{screen.innerHTML=`<div class="v3-canvas"><div class="v3-mapbar"><h3>No active incident selected for ${esc(selected().name)}</h3>${btn('Return to site incidents','siteIncidents')}</div>${liveNocQueue()}</div>`;}};
const previousIncidentPanel=incidentPanel;
incidentPanel=function(){let html=previousIncidentPanel();if(s.highlightIncident)html=html.replace(`<div class="v5-ticket-list">`,`<p class="v6-located">Located ${esc(s.highlightIncident)} at ${esc(selected().name)}. Open the highlighted record to enter the AI NOC.</p><div class="v5-ticket-list">`).replace(`data-value="${s.highlightIncident}"`,`data-value="${s.highlightIncident}" class="v6-highlight"`);return html;};
function scenarioScopeView(){const c=curr();screen.innerHTML=`<div class="v3-canvas"><div class="v3-mapbar"><h3>${c.incident} · ${esc(c.title)}</h3><span class="ea-note">Shared / global service scenario</span></div><div class="v3-evidence"><p>${esc(c.profile.impact)}</p><p class="v6-located">The source scenario does not identify affected individual sites. It has not been assigned to Singapore or another arbitrary site.</p><p>To provide a site-specific NOC link, the production service model must identify which entitled sites consume this shared service.</p>${btn('Explore estate sites','home')}</div></div>`;}
const beforeNavigationFix=act;
act=function(a,v){if(['home','region','country','hub','zone'].includes(a)){s.sitePage=0;s.highlightIncident=null;if(s.persona==='AI/Digital')s.persona='Overview';}if(a==='sitePage'){s.sitePage=Number(v);render();save();return;}if(a==='locateCase'){a='case';v=root.querySelector('#ea-scenario').value;}if(a==='case'){s.caseId=v;s.record=null;s.zone=null;s.trace=false;s.evidence=false;s.assistantAnswer='';s.persona='Operations';const c=curr(),ids=affected[ix()];if(!ids.length){s.view='scenario';s.region='world';s.country=null;s.hub=null;s.highlightIncident=null;}else{if(!ids.includes(s.site))s.site=ids[0];const t=selected();s.region=t.region;s.country=t.country;s.hub=t.hub;s.view='topology';s.node='incident';s.priority=0;const r=demoRecords.find(r=>r.id===c.incident);s.ticketState=r&&isClosed(r)?'closed':'open';s.highlightIncident=c.incident;}render();save();return;}if(a==='siteIncidents'){s.persona='Operations';s.view='topology';s.node='incident';s.priority=0;s.ticketState='open';s.highlightIncident=null;render();save();return;}if(a==='noc'){const r=demoRecords.find(r=>r.id===v);if(!r||!r.siteIds.includes(selected().id)||isClosed(r)){s.view='topology';s.persona='Operations';s.node='incident';s.ticketState='closed';s.highlightIncident=null;render();save();return;}}if(a==='site'){s.record=null;s.highlightIncident=null;}if(a==='persona'&&v==='Engineering'){s.branch='Device';s.node='Device';s.view='topology';s.region=selected().region;s.country=selected().country;s.hub=selected().hub;s.zone=null;}if(a==='node'){const branch={config:'Device',verification:'Device',history:'Device',routing:'Traffic',topology:'Traffic',qos:'Traffic',transactions:'Application',synthetics:'Application'}[v];if(branch)s.branch=branch;if(v==='verification'){s.node=v;s.evidence=true;s.trace=false;render();save();return;}}beforeNavigationFix(a,v);};

root.querySelector('#ea-scenario').innerHTML=cases.map(c=>`<option value="${c.id}">${esc(c.rw+' · '+c.title)}</option>`).join('');root.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(b)act(b.dataset.act,b.dataset.value)});root.querySelector('#ea-scenario').addEventListener('change',e=>act('case',e.target.value));
function restore(v){const p=v?.privateContent;if(p?.version!==5)return;if(!cases.some(c=>c.id===p.caseId)||!sites.some(t=>t.id===p.site))return;s={...s,...p};if(!['Overview','Operations','Engineering','AI/Digital'].includes(s.persona))s.persona='Overview';render();}render();restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));if(globalThis.Tweak){const tw=new Tweak({container:root,onChange:render});tw.addToggle(design,'showBrief',{label:'Show concise service briefing'});}
})();

</script>
