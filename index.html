<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07131e">
<title>Rolwaling to Makalu — Nepal 2026</title>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#07131e;font-family:Arial,Helvetica,sans-serif;color:#fff}
main{max-width:1536px;margin:0 auto;background:#f5f2eb}
.hero,.route,.itinerary{line-height:0;background:#f5f2eb}
.hero img,.route img,.itinerary img{display:block;width:100%;height:auto}
.route{position:relative}
.hot{position:absolute;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:#a52c28;box-shadow:0 0 0 2px rgba(7,19,30,.65);transform:translate(-50%,-50%);cursor:pointer;transition:.16s}
.hot:hover,.hot.active{transform:translate(-50%,-50%) scale(1.25)}
.tip{display:none;position:absolute;z-index:5;line-height:1.35;width:205px;background:#07131e;color:#fff;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:12px}
.tip b{display:block;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}.tip span{color:#bdc7cc}
.follow{background:#07131e;padding:34px 34px 40px}.follow h2{font-family:"Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;font-size:28px;margin:0 0 20px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{display:block;position:relative;height:310px;overflow:hidden;border:1px solid #40505b;text-decoration:none;color:#fff;background:#10212e}.card img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}.card:hover img{transform:scale(1.025)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,13,19,.02) 35%,rgba(5,13,19,.92) 100%)}.label{position:absolute;left:22px;right:22px;bottom:20px;line-height:1.2}.label small{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#c0cbd1}.label b{display:block;font-family:"Arial Narrow",Arial,sans-serif;text-transform:uppercase;font-size:28px;margin-top:5px}.label span{display:block;color:#c5ced3;font-size:12px;margin-top:5px}.links{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.btn{color:#fff;text-decoration:none;border:1px solid #66757e;padding:10px 13px;font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.btn:hover{background:#fff;color:#07131e}
.status{border-top:1px solid #31424d;margin-top:24px;padding-top:18px;color:#b9c4ca;font-size:11px;letter-spacing:.05em}.status b{color:#fff;text-transform:uppercase;letter-spacing:.12em;margin-right:10px}
footer{background:#05101a;border-top:1px solid #263844;padding:22px 34px;color:#9caab3;font-size:10px;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;gap:20px}
@media(max-width:800px){.cards{grid-template-columns:1fr}.card{height:270px}.follow{padding:28px 16px 34px}.hot{width:16px;height:16px}.tip{width:180px}.hero img,.route img,.itinerary img{min-width:0}footer{padding:20px 16px;flex-direction:column}}
</style>
</head>
<body>
<main>
<section class="hero"><img src="header.jpg" alt="Rolwaling to Makalu — 47 Day High Himalayan Expedition and Traverse, 26 September to 11 November 2026"></section>

<section class="route" id="route">
<img src="elevation.jpg" alt="Rolwaling to Makalu mountain elevation profile">
<button class="hot" data-id="tashi" style="left:22.6%;top:32.3%" aria-label="Tashi Lapcha"></button>
<button class="hot" data-id="renjo" style="left:39.4%;top:34.8%" aria-label="Renjo La"></button>
<button class="hot" data-id="chola" style="left:50.9%;top:36.1%" aria-label="Cho La"></button>
<button class="hot" data-id="amphu" style="left:65.5%;top:34.9%" aria-label="Amphu Laptsa"></button>
<button class="hot" data-id="peak" style="left:75.7%;top:29.1%" aria-label="Expedition Peak"></button>
<button class="hot" data-id="west" style="left:84.0%;top:35.1%" aria-label="West Col"></button>
<button class="hot" data-id="sherpani" style="left:90.3%;top:34.2%" aria-label="Sherpani Col"></button>
<button class="hot" data-id="makalu" style="left:95.0%;top:41.0%" aria-label="Makalu Base Camp"></button>
<div class="tip" id="tip"></div>
</section>

<section class="itinerary"><img src="itinerary.jpg" alt="47 day Rolwaling to Makalu itinerary"></section>

<section class="follow">
<h2>Maps &amp; Tracking</h2>
<div class="cards">
<a class="card" href="https://www.google.com/maps/d/viewer?mid=1G0UML04gTbzW4QuVbBuIo6lR7fnK_k0" target="_blank" rel="noopener">
<img src="google-map.jpg" alt="Planned Rolwaling to Makalu route map"><div class="shade"></div>
<div class="label"><small>Planned route</small><b>Google My Maps</b><span>Explore the route and waypoints</span></div>
</a>
<a class="card" href="https://share.garmin.com/radventuretravel" target="_blank" rel="noopener">
<img src="garmin-map.jpg" alt="Garmin MapShare expedition tracking"><div class="shade"></div>
<div class="label"><small>Live satellite position</small><b>Garmin MapShare</b><span>Follow actual progress during the expedition</span></div>
</a>
</div>
<div class="links"><a class="btn" href="https://www.google.com/maps/d/viewer?mid=1G0UML04gTbzW4QuVbBuIo6lR7fnK_k0" target="_blank" rel="noopener">Open Google route</a><a class="btn" href="https://share.garmin.com/radventuretravel" target="_blank" rel="noopener">Open Garmin tracking</a><a class="btn" href="route.gpx">Download GPX</a></div>
<div class="status"><b>Expedition status</b><span id="status"></span></div>
</section>
<footer><span>Nepal 2026</span><span>Rolwaling · Khumbu · Hongu · Makalu</span></footer>
</main>
<script>
const pts={
tashi:['Tashi Lapcha','5,755 m','Day 8 · 3 October'],
renjo:['Renjo La','5,360 m','Day 11 · 6 October'],
chola:['Cho La','5,420 m','Day 14 · 9 October'],
amphu:['Amphu Laptsa','5,845 m','Day 22 · 17 October'],
peak:['Expedition Peak','approx. 6,500–6,700 m','Days 26–34'],
west:['West Col','6,143 m','Days 35–36'],
sherpani:['Sherpani Col','6,135 m','Day 37 · 1 November'],
makalu:['Makalu Base Camp','4,450 m','Days 38–40']
};
const route=document.getElementById('route'),tip=document.getElementById('tip');
function show(id){
 document.querySelectorAll('.hot').forEach(h=>h.classList.toggle('active',h.dataset.id===id));
 const p=pts[id],h=document.querySelector('.hot[data-id="'+id+'"]'),hb=h.getBoundingClientRect(),rb=route.getBoundingClientRect();
 tip.innerHTML='<b>'+p[0]+'</b><span>'+p[1]+' · '+p[2]+'</span>';
 tip.style.display='block';
 tip.style.left=Math.max(8,Math.min(rb.width-215,hb.left-rb.left-90))+'px';
 tip.style.top=Math.max(8,hb.top-rb.top+24)+'px';
}
document.querySelectorAll('.hot').forEach(h=>{h.addEventListener('mouseenter',()=>show(h.dataset.id));h.addEventListener('click',()=>show(h.dataset.id))});
route.addEventListener('mouseleave',()=>tip.style.display='none');

const start=Date.UTC(2026,8,26),end=Date.UTC(2026,10,11),n=new Date(),today=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate());
const status=document.getElementById('status');
if(today<start){const d=Math.ceil((start-today)/86400000);status.textContent=d+' days until departure · 26 September 2026';}
else if(today>end){status.textContent='Expedition completed · 11 November 2026';}
else{const d=Math.floor((today-start)/86400000)+1;status.textContent='Day '+d+' of 47';}
</script>
</body>
</html>
